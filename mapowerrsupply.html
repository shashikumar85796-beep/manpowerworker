<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BrightHands Workforce — Manpower Supply &amp; Contract Staffing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #081a2d;
  --navy: #0b2239;
  --navy-2: #12365a;
  --navy-3: #1b4b7a;
  --amber: #f5a524;
  --amber-l: #ffc65c;
  --amber-d: #c97a00;
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #16263a;
  --muted: #5a6b80;
  --line: #e3e9f1;
  --green: #12a150;
  --radius: 20px;
  --shadow-sm: 0 1px 2px rgba(8, 26, 45, 0.05), 0 4px 14px rgba(8, 26, 45, 0.05);
  --shadow: 0 2px 4px rgba(8, 26, 45, 0.04), 0 14px 38px rgba(8, 26, 45, 0.08);
  --font-head: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 92px; }
body {
  font-family: var(--font-body); color: var(--text); background: var(--bg);
  line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
h1, h2, h3, h4, .logo b, .btn, .filter, .num { font-family: var(--font-head); }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
svg { flex: none; }
.container { width: min(1200px, 100% - 40px); margin-inline: auto; }
.section { padding: 104px 0; position: relative; }
.section.tint { background: #fff; }
.center { justify-content: center; }
.muted-s { color: var(--muted); font-size: 0.88rem; }

/* ---------- section headings ---------- */
.section-head { margin-bottom: 56px; }
.section-head.center { text-align: center; }
.section-head.left { text-align: left; margin-bottom: 32px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; font: 700 0.74rem var(--font-head); letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--amber-d); margin-bottom: 16px;
}
.eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--amber); border-radius: 2px; }
.section-head h2, .cta h2 {
  font-size: clamp(1.9rem, 3.5vw, 2.85rem); line-height: 1.12; color: var(--ink); font-weight: 800; letter-spacing: -0.03em;
}
.sub { color: var(--muted); max-width: 620px; margin-top: 16px; font-size: 1.04rem; }
.section-head.center .sub { margin-inline: auto; }
.section-head.light h2 { color: #fff; }
.section-head.light .sub { color: #9db8d4; }
.section-head.light .eyebrow { color: var(--amber-l); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 14px 26px; border-radius: 14px;
  font-weight: 700; font-size: 0.95rem; border: 1.5px solid transparent; cursor: pointer; white-space: nowrap;
  transition: background 0.25s, color 0.25s, box-shadow 0.25s, border-color 0.25s;
}
.btn.full { width: 100%; padding: 15px; }
.btn-primary { background: linear-gradient(135deg, var(--amber-l), var(--amber)); color: #261700; box-shadow: 0 10px 28px rgba(245, 165, 36, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
.btn-primary:hover { box-shadow: 0 14px 34px rgba(245, 165, 36, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
.btn-ghost { border-color: rgba(255, 255, 255, 0.28); color: #fff; background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(8px); }
.btn-ghost:hover { background: #fff; color: var(--navy); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:hover { background: var(--navy-3); }
.btn-wa { background: #25d366; color: #fff; }
.btn-wa:hover { background: #1db955; }
.btn-outline-dark { border-color: var(--ink); color: var(--ink); }
.btn-outline-dark:hover { background: var(--ink); color: #fff; }
.btn-sm { padding: 10px 18px; font-size: 0.86rem; border-radius: 11px; }
.btn.icon-only { padding: 10px 12px; }

/* ---------- topbar & nav ---------- */
.topbar { background: var(--ink); color: #a9c0d8; font-size: 0.8rem; padding: 9px 0; }
.topbar .container { display: flex; gap: 28px; flex-wrap: wrap; }
.topbar span { display: inline-flex; align-items: center; gap: 7px; }
.topbar svg { color: var(--amber); }

.nav {
  position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.78);
  backdrop-filter: saturate(180%) blur(16px); border-bottom: 1px solid transparent; transition: box-shadow 0.3s, border-color 0.3s;
}
.nav.scrolled { box-shadow: 0 8px 28px rgba(8, 26, 45, 0.08); border-color: var(--line); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; height: 74px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark {
  width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-weight: 800; font-size: 0.95rem;
  background: linear-gradient(135deg, var(--ink), var(--navy-3)); color: var(--amber-l);
  box-shadow: 0 8px 18px rgba(8, 26, 45, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
.logo b { display: block; color: var(--ink); line-height: 1.15; font-size: 1.02rem; letter-spacing: -0.01em; }
.logo small { color: var(--muted); font-size: 0.7rem; }
.nav-links { display: flex; align-items: center; gap: 30px; }
.nav-links .link { position: relative; font-weight: 500; font-size: 0.92rem; padding: 6px 0; color: #2b3d52; }
.nav-links .link::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--amber);
  transform: scaleX(0); transform-origin: right; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.nav-links .link:hover::after { transform: scaleX(1); transform-origin: left; }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: linear-gradient(90deg, var(--amber), #ff7a18); transform-origin: left; }

.burger { display: none; background: none; border: 0; width: 44px; height: 44px; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
.burger span { display: block; width: 24px; height: 2.5px; border-radius: 2px; background: var(--ink); }
.mobile-menu { overflow: hidden; background: #fff; border-top: 1px solid var(--line); }
.mobile-inner { display: flex; flex-direction: column; gap: 4px; padding: 14px 20px 24px; }
.mobile-inner > a:not(.btn) { padding: 14px 4px; font-weight: 600; border-bottom: 1px solid var(--line); }
.mobile-inner .btn { margin-top: 14px; }

/* ---------- hero ---------- */
.hero {
  color: #fff; padding: 92px 0 108px; position: relative; overflow: hidden;
  background:
    radial-gradient(900px 500px at 85% -5%, rgba(46, 124, 196, 0.55), transparent 60%),
    radial-gradient(700px 400px at 0% 100%, rgba(245, 165, 36, 0.14), transparent 60%),
    linear-gradient(160deg, #06182a 0%, #0b2744 55%, #11406b 100%);
}
.grid-bg {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
  background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
  background-size: 56px 56px; mask-image: radial-gradient(ellipse at 60% 40%, #000 20%, transparent 70%);
}
.orb { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; }
.orb-1 { width: 420px; height: 420px; right: -100px; top: -100px; background: rgba(245, 165, 36, 0.28); }
.orb-2 { width: 380px; height: 380px; left: -140px; bottom: -140px; background: rgba(66, 153, 225, 0.28); }
.hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 72px; align-items: center; position: relative; z-index: 1; }
.badge {
  display: inline-flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16); padding: 8px 16px; border-radius: 99px; font-size: 0.8rem; font-weight: 500;
  margin-bottom: 26px; backdrop-filter: blur(8px); color: #dbe8f6;
}
.badge i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.28); animation: pulse 2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); } }
.hero h1 { font-size: clamp(2.5rem, 5.4vw, 4.2rem); line-height: 1.04; font-weight: 800; letter-spacing: -0.035em; }
.word-mask { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 0.04em 0.12em; margin-bottom: -0.12em; }
.word-mask > span { display: inline-block; white-space: pre; }
.grad { background: linear-gradient(95deg, var(--amber-l), #ff8a3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lead { margin-top: 26px; font-size: 1.14rem; color: #b6cce3; max-width: 540px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 34px; }
.cta-row.center { justify-content: center; }
.checks { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 26px; }
.checks li { display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; color: #cfe0f2; font-weight: 500; }
.checks svg { color: #34d399; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 52px; padding-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
.stat { padding-right: 12px; }
.stat + .stat { padding-left: 20px; border-left: 1px solid rgba(255, 255, 255, 0.1); }
.stat b { font: 800 1.9rem var(--font-head); letter-spacing: -0.02em; color: #fff; display: block; line-height: 1.1; }
.stat span { font-size: 0.78rem; color: #8fb0d0; }

/* ---------- form ---------- */
.form-wrap { position: relative; }
.form-card {
  position: relative; background: #fff; color: var(--text); border-radius: 26px; padding: 32px;
  box-shadow: 0 40px 90px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.6) inset; z-index: 1;
}
.form-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.form-card h3 { color: var(--ink); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
.reply { display: inline-flex; align-items: center; gap: 7px; font-size: 0.75rem; font-weight: 600; color: var(--green); background: #e8f8ef; padding: 5px 11px; border-radius: 99px; }
.reply i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.form-card .s { color: var(--muted); font-size: 0.9rem; margin: 6px 0 20px; }
.field { margin-bottom: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 6px; color: var(--navy); }
input, select, textarea {
  width: 100%; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 12px; font: inherit; font-size: 0.93rem;
  background: #f7f9fc; color: var(--text); transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
input::placeholder, textarea::placeholder { color: #9aa9bb; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); background: #fff; box-shadow: 0 0 0 4px rgba(245, 165, 36, 0.2); }
textarea { resize: vertical; min-height: 80px; }
.form-ok { display: flex; align-items: center; gap: 8px; background: #e8f8ee; color: #136c36; padding: 12px 14px; border-radius: 12px; font-size: 0.88rem; margin-top: 12px; overflow: hidden; }
.form-note { text-align: center; font-size: 0.85rem; color: var(--muted); margin-top: 16px; }

.float-chip { position: absolute; z-index: 2; }
.chip-inner {
  display: flex; align-items: center; gap: 12px; background: #fff; color: var(--ink); padding: 12px 18px 12px 12px;
  border-radius: 16px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28); white-space: nowrap;
}
.chip-inner b { display: block; font: 700 0.86rem var(--font-head); line-height: 1.2; }
.chip-inner small { color: var(--muted); font-size: 0.72rem; }
.chip-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; }
.chip-ico.green { background: #e3f7ec; color: var(--green); }
.chip-ico.amber { background: #fff1d6; color: var(--amber-d); }
.chip-a { top: -22px; right: -26px; }
.chip-b { bottom: 70px; left: -54px; }

/* ---------- marquee ---------- */
.marquee { background: var(--ink); color: #b6cce3; padding: 20px 0; overflow: hidden; white-space: nowrap; border-top: 1px solid rgba(255, 255, 255, 0.06); }
.marquee-track { display: inline-flex; will-change: transform; }
.marquee-track span { font: 600 0.92rem var(--font-head); padding: 0 24px; display: inline-flex; align-items: center; gap: 48px; letter-spacing: 0.01em; }
.marquee-track em { width: 6px; height: 6px; background: var(--amber); transform: rotate(45deg); }

/* ---------- bento services ---------- */
.bento { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.bento-card {
  position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 28px; box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.bento-card:hover { border-color: rgba(245, 165, 36, 0.6); box-shadow: var(--shadow); }
.bento-card.feature {
  grid-column: span 2; grid-row: span 2; color: #fff; border: 0; padding: 36px;
  background: linear-gradient(155deg, #0b2744 0%, #123e68 100%);
}
.bento-card.feature h3 { color: #fff; font-size: 1.7rem; letter-spacing: -0.02em; margin-top: auto; }
.bento-card.feature p { color: #b0c7de; font-size: 1rem; max-width: 420px; }
.bento-card.feature .more { color: var(--amber-l); }
.feature-art {
  position: absolute; right: -60px; top: -60px; width: 300px; height: 300px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(245, 165, 36, 0.35), transparent 65%);
}
.bento-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; position: relative; z-index: 1; }
.feature .bento-top { margin-bottom: 0; }
.ico { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: #fff3dc; color: var(--amber-d); }
.feature .ico { width: 62px; height: 62px; background: rgba(255, 255, 255, 0.1); color: var(--amber-l); border: 1px solid rgba(255, 255, 255, 0.14); }
.tag.solid { background: var(--amber); color: #261700; }
.bento-card h3 { font-size: 1.08rem; color: var(--ink); margin-bottom: 8px; font-weight: 700; letter-spacing: -0.01em; position: relative; z-index: 1; }
.bento-card p { color: var(--muted); font-size: 0.91rem; position: relative; z-index: 1; }
.more { display: inline-flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 18px; font: 700 0.86rem var(--font-head); color: var(--amber-d); position: relative; z-index: 1; }
.more svg { transition: transform 0.25s; }
.bento-card:hover .more svg { transform: translateX(5px); }

/* ---------- process ---------- */
.section.dark { background: radial-gradient(800px 400px at 50% 0%, rgba(27, 75, 122, 0.5), transparent 70%), var(--ink); color: #fff; overflow: hidden; }
.process { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; position: relative; }
.process .line { position: absolute; top: 35px; left: 12.5%; right: 12.5%; height: 2px; background: linear-gradient(90deg, transparent, var(--amber), transparent); transform-origin: left; }
.step { text-align: center; position: relative; }
.num {
  width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 22px; display: grid; place-items: center;
  font-weight: 800; font-size: 1.15rem; color: #261700; background: linear-gradient(135deg, var(--amber-l), var(--amber));
  box-shadow: 0 0 0 8px rgba(245, 165, 36, 0.14), 0 12px 28px rgba(245, 165, 36, 0.3);
}
.step h3 { font-size: 1.08rem; margin-bottom: 8px; letter-spacing: -0.01em; }
.step p { color: #94b0cd; font-size: 0.9rem; max-width: 230px; margin: 0 auto; }

/* ---------- why ---------- */
.why-split { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 72px; align-items: start; }
.why-side { position: sticky; top: 120px; }
.why-cta { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.why-list { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.why { display: flex; gap: 16px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow-sm); transition: border-color 0.3s, box-shadow 0.3s; }
.why:hover { border-color: rgba(245, 165, 36, 0.6); box-shadow: var(--shadow); }
.why-ico { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; background: #eaf2fb; color: var(--navy-3); flex: none; }
.why h3 { font-size: 0.98rem; color: var(--ink); margin-bottom: 3px; letter-spacing: -0.01em; }
.why p { font-size: 0.86rem; color: var(--muted); line-height: 1.55; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.chip {
  background: var(--bg); border: 1px solid var(--line); padding: 12px 24px; border-radius: 99px; font: 600 0.92rem var(--font-head);
  color: var(--navy); cursor: default; transition: background 0.25s, color 0.25s, border-color 0.25s;
}
.chip:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ---------- jobs ---------- */
.filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: -20px 0 38px; }
.filter { position: relative; border: 1px solid var(--line); background: #fff; padding: 10px 22px; border-radius: 99px; font-weight: 600; font-size: 0.88rem; color: var(--navy); cursor: pointer; }
.filter .pill { position: absolute; inset: 0; border-radius: 99px; background: var(--ink); }
.filter-label { position: relative; z-index: 1; transition: color 0.25s; }
.filter.on .filter-label { color: #fff; }
.jobs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.job { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; transition: border-color 0.3s, box-shadow 0.3s; }
.job:hover { border-color: rgba(245, 165, 36, 0.6); box-shadow: var(--shadow); }
.job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.job h3 { font-size: 1.1rem; color: var(--ink); letter-spacing: -0.01em; }
.job p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; background: #eef3fa; color: var(--navy-2); padding: 4px 11px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.tag.live { background: #e6f8ee; color: var(--green); }
.tag.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.job-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: auto; padding-top: 18px; border-top: 1px dashed var(--line); }
.salary { font: 800 1.08rem var(--font-head); color: var(--ink); letter-spacing: -0.01em; }
.salary small { font: 500 0.75rem var(--font-body); color: var(--muted); margin-left: 3px; }
.actions { display: flex; gap: 8px; }

/* ---------- faq ---------- */
.faq-wrap { max-width: 800px; }
.faq { display: flex; flex-direction: column; gap: 12px; }
.faq-item { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; }
.faq-item.open { background: #fff; border-color: rgba(245, 165, 36, 0.6); box-shadow: var(--shadow); }
.faq-item button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; background: none; border: 0; padding: 20px 24px; cursor: pointer; text-align: left; font: 700 1rem var(--font-head); color: var(--ink); }
.plus { width: 32px; height: 32px; border-radius: 50%; background: #fff3dc; color: var(--amber-d); display: grid; place-items: center; flex: none; }
.faq-a { overflow: hidden; }
.faq-a p { padding: 0 24px 22px; color: var(--muted); font-size: 0.95rem; max-width: 680px; }

/* ---------- CTA ---------- */
.cta {
  position: relative; overflow: hidden; text-align: center; border-radius: 32px; padding: 84px 28px; color: #fff;
  background: linear-gradient(135deg, #0a2540, #143f69);
}
.cta-blob { position: absolute; width: 520px; height: 520px; right: -140px; top: -220px; border-radius: 50%; background: radial-gradient(circle, rgba(245, 165, 36, 0.38), rgba(245, 165, 36, 0) 68%); pointer-events: none; }
.cta-grid {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.6;
  background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
  background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
}
.cta > *:not(.cta-blob):not(.cta-grid) { position: relative; z-index: 1; }
.cta .eyebrow { color: var(--amber-l); }
.cta h2 { color: #fff; max-width: 760px; margin: 0 auto; }
.cta p { max-width: 600px; margin: 18px auto 32px; color: #a9c1db; }
.cta .btn-dark { background: var(--amber); color: #261700; }
.cta .btn-dark:hover { background: var(--amber-l); }
.cta .btn-outline-dark { border-color: rgba(255, 255, 255, 0.35); color: #fff; }

  <a class="float-wa pop" style="--d:1.8s" target="_blank" rel="noopener noreferrer" href="${wa("Hi, I need manpower.")}" aria-label="Chat on WhatsApp"><span class="ping"></span>${ic("chat", 26)}</a>`;
}

/* ---------- behaviour ---------- */
function initNav() {
  const nav = $("#nav"), bar = $("#progress");
  const on = () => {
    nav.classList.toggle("scrolled", scrollY > 16);
    const h = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`;
  };
  on(); addEventListener("scroll", on, { passive: true });
  const b = $("#burger"), m = $("#mmenu");
  b.onclick = () => { b.classList.toggle("open"); m.classList.toggle("open"); };
  $$("#mmenu a").forEach(a => a.addEventListener("click", () => { b.classList.remove("open"); m.classList.remove("open"); }));
}

function initReveal() {
  $$("[data-stagger]").forEach(c => [...c.children].forEach((el, i) => {
    el.classList.add("rv"); el.style.setProperty("--d", `${(i * parseFloat(c.dataset.stagger)).toFixed(2)}s`);
  }));
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target; io.unobserve(el); el.classList.add("in");
    setTimeout(() => { el.classList.remove("rv", "in"); el.style.removeProperty("--d"); }, 1500);
  }), { threshold: 0.12, rootMargin: "0px 0px -60px 0px" });
  $$(".rv").forEach(el => io.observe(el));
  const lio = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { $("#procLine").classList.add("in"); lio.disconnect(); } }), { threshold: 0.3 });
  lio.observe($("#processBox"));
}

function initCounters() {
  const run = el => {
    const end = +el.dataset.count, suf = el.dataset.suffix || "", t0 = performance.now(), dur = 1800;
    const tick = t => {
      const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 4);
      el.textContent = Math.round(end * e).toLocaleString("en-IN") + suf;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { io.unobserve(en.target); run(en.target); } }), { threshold: 0.4 });
  $$("[data-count]").forEach(el => io.observe(el));
}

function initRoles() {
  const b = $("#role"); let i = 0;
  setInterval(async () => {
    const out = b.animate([{ transform: "translateY(0)", opacity: 1, filter: "blur(0)" }, { transform: "translateY(-26px)", opacity: 0, filter: "blur(6px)" }], { duration: 350, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" });
    await out.finished; i = (i + 1) % ROLES.length; b.textContent = ROLES[i];
    b.animate([{ transform: "translateY(26px)", opacity: 0, filter: "blur(6px)" }, { transform: "translateY(0)", opacity: 1, filter: "blur(0)" }], { duration: 400, easing: "cubic-bezier(.22,1,.36,1)", fill: "forwards" });
  }, 2400);
}

function initHeroFx() {
  const hero = $("#home"), spot = $("#spot");
  let tx = 700, ty = 260, x = tx, y = ty;
  hero.addEventListener("mousemove", e => { const r = hero.getBoundingClientRect(); tx = e.clientX - r.left; ty = e.clientY - r.top; });
  (function loop() { x += (tx - x) * 0.08; y += (ty - y) * 0.08; spot.style.background = `radial-gradient(520px circle at ${x}px ${y}px, rgba(245,165,36,0.16), transparent 70%)`; requestAnimationFrame(loop); })();
  const o1 = $(".orb-1"), o2 = $(".orb-2"), cue = $(".scroll-cue");
  addEventListener("scroll", () => {
    const s = scrollY; o1.style.transform = `translateY(${Math.min(s, 600) * 0.18}px)`; o2.style.transform = `translateY(${-Math.min(s, 600) * 0.12}px)`;
    cue.style.opacity = Math.max(0, 1 - s / 400);
  }, { passive: true });
  // magnetic buttons
  $$(".mag").forEach(el => {
    el.addEventListener("mousemove", e => { const r = el.getBoundingClientRect(); el.style.transform = `translate(${(e.clientX - (r.left + r.width / 2)) * 0.22}px,${(e.clientY - (r.top + r.height / 2)) * 0.22}px)`; });
    el.addEventListener("mouseleave", () => { el.style.transform = ""; });
  });
}

function initForm() {
  $("#enqForm").addEventListener("submit", e => {
    e.preventDefault(); const f = new FormData(e.target);
    const text = `New Enquiry\nName: ${f.get("name")}\nPhone: ${f.get("phone")}\nEmail: ${f.get("email") || "-"}\nType: ${f.get("type")}\nRequirement: ${f.get("msg") || "-"}`;
    window.open(wa(text), "_blank", "noopener");
    const ok = $("#formOk"); ok.classList.add("show"); e.target.reset(); setTimeout(() => ok.classList.remove("show"), 6000);
  });
}

function initJobs() {
  const cats = ["All", ...new Set(JOBS.map(j => j.cat))]; let active = "All";
  const fil = $("#filters"), grid = $("#jobsGrid");
  const draw = () => {
    fil.innerHTML = cats.map(c => `<button class="filter ${c === active ? "on" : ""}" data-c="${c}"><span class="filter-label">${c}</span></button>`).join("");
    const list = active === "All" ? JOBS : JOBS.filter(j => j.cat === active);
    grid.innerHTML = list.map((j, i) => `<article class="job job-in" style="--d:${i * 0.06}s">
      <div class="job-top"><h3>${j.title}</h3><span class="tag live"><i></i> Hiring</span></div>
      <div class="meta"><span class="tag">${ic("pin", 12)} ${j.loc}</span><span class="tag">${j.exp}</span><span class="tag">Full time</span></div>
      <p>${j.desc}</p>
      <div class="job-foot"><div class="salary">${j.pay}<small>/month</small></div>
        <div class="actions"><a class="btn btn-dark btn-sm" href="#enquiry">Apply</a><a class="btn btn-wa btn-sm icon-only" target="_blank" rel="noopener noreferrer" aria-label="Apply for ${j.title} on WhatsApp" href="${wa("Hi, I want to apply for: " + j.title)}">${ic("chat", 16)}</a></div></div></article>`).join("");
    $$(".filter", fil).forEach(b => b.onclick = () => { active = b.dataset.c; draw(); });
  };
  draw();
}

function initReviews() {
  const vp = $(".rev-viewport"), track = $("#revTrack"), cards = [...track.children], GAP = 22;
  const prev = $("#revPrev"), next = $("#revNext"), dotsEl = $("#revDots");
  let idx = 0, max = 0, cardW = 300, per = 3, paused = false, drag = null;
  const apply = () => {
    track.style.transform = `translateX(${-idx * (cardW + GAP)}px)`;
    prev.disabled = idx === 0; next.disabled = idx === max;
    $$(".dot", dotsEl).forEach((d, i) => d.classList.toggle("on", i === idx));
  };
  const layout = () => {
    const w = vp.clientWidth; per = w < 700 ? 1 : w < 1000 ? 2 : 3;
    max = Math.max(0, cards.length - per); cardW = (w - GAP * (per - 1)) / per;
    cards.forEach(c => c.style.width = cardW + "px"); idx = Math.min(idx, max);
    dotsEl.innerHTML = Array.from({ length: max + 1 }, (_, i) => `<button class="dot" aria-label="Go to slide ${i + 1}"><span class="dot-fill"></span></button>`).join("");
    $$(".dot", dotsEl).forEach((d, i) => d.onclick = () => { idx = i; apply(); });
    apply();
  };
  prev.onclick = () => { idx = Math.max(0, idx - 1); apply(); };
  next.onclick = () => { idx = Math.min(max, idx + 1); apply(); };
  let raf = 0, lastW = -1;
  new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { const w = vp.clientWidth; if (w !== lastW) { lastW = w; layout(); } });
  }).observe(vp);
  lastW = vp.clientWidth; layout();
  setInterval(() => { if (!paused && max > 0) { idx = idx >= max ? 0 : idx + 1; apply(); } }, 4500);
  const wrap = $("#revWrap"); wrap.onmouseenter = () => paused = true; wrap.onmouseleave = () => paused = false;
  track.addEventListener("pointerdown", e => { drag = { x: e.clientX, base: -idx * (cardW + GAP) }; track.classList.add("dragging"); track.setPointerCapture(e.pointerId); });
  track.addEventListener("pointermove", e => { if (drag) track.style.transform = `translateX(${drag.base + (e.clientX - drag.x)}px)`; });
  const end = e => { if (!drag) return; const dx = e.clientX - drag.x; drag = null; track.classList.remove("dragging"); if (dx < -60) idx = Math.min(max, idx + 1); else if (dx > 60) idx = Math.max(0, idx - 1); apply(); };
  track.addEventListener("pointerup", end); track.addEventListener("pointercancel", end);
}

function initFaq() {
  $$(".faq-item").forEach(it => $("button", it).addEventListener("click", () => {
    const open = it.classList.contains("open");
    $$(".faq-item").forEach(o => { o.classList.remove("open"); $("button", o).setAttribute("aria-expanded", "false"); });
    if (!open) { it.classList.add("open"); $("button", it).setAttribute("aria-expanded", "true"); }
  }));
}

render(); initNav(); initReveal(); initCounters(); initRoles(); initHeroFx(); initForm(); initJobs(); initReviews(); initFaq();

</script>
